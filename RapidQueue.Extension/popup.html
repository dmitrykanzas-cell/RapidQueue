<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>RapidQueue</title>
  <style>
    body {
      width: 320px;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
    }
    h3 {
      margin: 0 0 10px 0;
      font-size: 14px;
      font-weight: 600;
    }
    label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      cursor: pointer;
    }
    button {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: white;
      cursor: pointer;
      font-size: 12px;
    }
    button:hover {
      background: #f5f5f5;
    }
    #logs {
      max-height: 200px;
      overflow-y: auto;
      margin-top: 8px;
      padding: 8px;
      background: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-family: monospace;
      font-size: 11px;
      white-space: pre-wrap;
    }
    .log-entry {
      margin-bottom: 4px;
      padding-bottom: 4px;
      border-bottom: 1px solid #eee;
    }
    .log-time {
      color: #999;
      font-size: 10px;
    }
    .log-category {
      color: #0066cc;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <h3>RapidQueue</h3>
  
  <label>
    <input type="checkbox" id="debugMode">
    Enable Debug Mode
  </label>
  
  <button id="dumpPage">Dump Current Page</button>
  <button id="exportLogs">Export Debug Logs</button>
  <button id="clearLogs">Clear Logs</button>
  
  <div id="logs"></div>
  
  <script src="popup.js"></script>
</body>
</html>
